<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task manager</title>
</head>
<body>
    <h1>Task Manager</h1>
    <dialog open>
        <form method="dialog">
            <div>
                <label for="nom_tarefa">nome da tarefa:</label>
                <input type="text" id="nom_tarefa" name="nome">
            </div>
            <div>
                <label for="descricao_tarefa">descrição</label>
                <textarea 
                id="descricao_tarefa"
                name="descricao"
                rows="4"
                ></textarea>
            </div>
            <div>
                
            </div>
        </form>
    </dialog>
    <h2>Tarefas agendadas</h2>
    
</body>
</html>
